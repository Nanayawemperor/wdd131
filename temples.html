<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Album</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="styles/temples.css">
  <link rel="stylesheet" href="styles/temples-large.css">

  <!-- JavaScript -->
  <script src="scripts/temples.js" defer></script>
</head>

<body>

  <header>
    <div class="header-top">
      <h1>Temple Album</h1>

      <button id="menu-button" aria-label="Open navigation menu">
        &#9776;
      </button>
    </div>

    <nav id="nav-menu">
      <a href="#">Home</a>
      <a href="#">Old</a>
      <a href="#">New</a>
      <a href="#">Large</a>
      <a href="#">Small</a>
    </nav>
  </header>

  <main>
    <h2>Temple Gallery</h2>

    <section class="gallery">
      <h3 class="visually-hidden">Temple Images</h3>

      <figure>
        <img src="images/temple1.png" alt="Salt Lake Temple">
        <figcaption>Salt Lake Temple</figcaption>
      </figure>

      <figure>
        <img src="images/temple2.png" alt="Accra Ghana Temple">
        <figcaption>Accra Ghana Temple</figcaption>
      </figure>

      <figure>
        <img src="images/temple3.png" alt="Rome Italy Temple">
        <figcaption>Rome Italy Temple</figcaption>
      </figure>

      <figure>
        <img src="images/temple4.png" alt="Tokyo Japan Temple">
        <figcaption>Tokyo Japan Temple</figcaption>
      </figure>

      <figure>
        <img src="images/temple5.png" alt="Nairobi Kenya Temple">
        <figcaption>Nairobi Kenya Temple</figcaption>
      </figure>

      <figure>
        <img src="images/temple6.png" alt="Paris France Temple">
        <figcaption>Paris France Temple</figcaption>
      </figure>

      <figure>
        <img src="images/temple7.png" alt="Mexico City Temple">
        <figcaption>Mexico City Temple</figcaption>
      </figure>

      <figure>
        <img src="images/temple8.png" alt="Sydney Australia Temple">
        <figcaption>Sydney Australia Temple</figcaption>
      </figure>

      <figure>
        <img src="images/temple9.png" alt="Johannesburg Temple">
        <figcaption>Johannesburg Temple</figcaption>
      </figure>

    </section>
  </main>

  <footer>
    <p>
      &copy; <span id="currentyear"></span> | Nanayaw Emperor | Ghana
    </p>

    <p id="lastModified"></p>
  </footer>

</body>
</html>
