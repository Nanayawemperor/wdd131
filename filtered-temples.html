<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="A responsive temple album gallery featuring beautiful temple images with a mobile-friendly navigation menu.">
  <meta name="author" content="Nanayaw Emperor">

  <title>Temple Album</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="styles/filtered-temples.css">
  <link rel="stylesheet" href="styles/temples-large.css">

  <!-- JavaScript -->
  <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>

  <header>
    <div class="header-top">
      <h1>Temple Album</h1>

      <button
        id="menu-button"
        aria-label="Open navigation menu"
        aria-expanded="false"
      >
        ☰
      </button>
    </div>

    <nav id="nav-menu" aria-label="Main navigation">
      <a href="#" data-filter="home">Home</a>
      <a href="#" data-filter="old">Old</a>
      <a href="#" data-filter="new">New</a>
      <a href="#" data-filter="large">Large</a>
      <a href="#" data-filter="small">Small</a>
    </nav>
  </header>

  <main>
    <h2>Temple Gallery</h2>

    <section class="gallery" id="temple-container" aria-live="polite">
      <!-- JavaScript renders temple cards here -->
    </section>
  </main>

  <footer>
    <p>
      &copy; <span id="currentyear"></span> | Nanayaw Emperor | Ghana
    </p>

    <p id="lastModified"></p>
  </footer>

</body>
</html>
