<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WDD 131 – Ghana – Emmanuel Okyere</title>
  <meta name="description" content="WDD 131 – Dynamic Web Fundamentals. Emmanuel Okyere. A place page about Ghana featuring data, weather, and culture.">
  <meta name="author" content="Emmanuel Okyere">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/place.css">
  <script src="scripts/place.js" defer></script>
</head>
<body>

  <div class="page-wrapper">

    <header>
      <h1>Ghana</h1>
    </header>

    <main>
        <!-- Hero image using picture/srcset for responsive images -->
        <picture class="hero">
        <source media="(min-width: 600px)" srcset="images/ghana-wide.webp">
        <img src="images/ghana-small.webp" alt="Aerial view of Accra, Ghana showing colourful rooftops and streets" width="800" height="500" loading="eager">
        </picture>

        <!-- Data section -->
        <section class="data-section">
        <h2>Data</h2>
        <dl class="data-list">
            <div class="data-row">
            <dt>Area:</dt>
            <dd>238,533 sq km</dd>
            </div>
            <div class="data-row">
            <dt>Population:</dt>
            <dd>33,475,870</dd>
            </div>
            <div class="data-row">
            <dt>Capital:</dt>
            <dd>Accra</dd>
            </div>
            <div class="data-row">
            <dt>Languages:</dt>
            <dd>English, Twi, Fante</dd>
            </div>
            <div class="data-row">
            <dt>Currency:</dt>
            <dd>Ghanaian Cedi</dd>
            </div>
            <div class="data-row">
            <dt>Time Zone:</dt>
            <dd>UTC+0</dd>
            </div>
            <div class="data-row">
            <dt>Calling Code:</dt>
            <dd>+233</dd>
            </div>
            <div class="data-row">
            <dt>Internet TLD:</dt>
            <dd>.gh</dd>
            </div>
        </dl>
        </section>

        <!-- Weather section -->
        <section class="weather-section">
        <h2 class="weather-heading">Weather</h2>

        <!-- SVG icon for mobile view -->
        <div class="weather-icon-mobile">
            <img src="images/partly-cloudy.svg" alt="Partly cloudy weather icon" width="80" height="80">
        </div>

        <dl class="data-list">
            <div class="data-row">
            <dt>Temperature:</dt>
            <dd>30 °C</dd>
            </div>
            <div class="data-row">
            <dt>Conditions:</dt>
            <dd>Partly Cloudy</dd>
            </div>
            <div class="data-row">
            <dt>Wind:</dt>
            <dd>15 km/h</dd>
            </div>
            <div class="data-row">
            <dt>Wind Chill:</dt>
            <dd id="windchill">N/A</dd>
            </div>
        </dl>
        </section>

        <footer>
        <p>&copy;<span id="currentyear"></span> ⭐ Emmanuel Okyere ⭐ Ghana</p>
        <p id="lastModified"></p>
        </footer>

    </main>
  </div>

</body>
</html>
